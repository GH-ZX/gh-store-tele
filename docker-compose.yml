services:
  bot:
    build:
      context: .
    container_name: 'GHstore'
    env_file:
      - .env
    ports:
      - "127.0.0.1:5000:5000" # ${WEBAPP_PORT}:${WEBAPP_PORT}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./i18n:/bot/i18n
    command: [ "python", "-u", "run.py" ]
    restart: always
    networks:
      - ghstore

  redis:
    image: redis:latest
    container_name: GHstore-redis
    command:
      - /bin/sh
      - -c
      - redis-server --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD variable is not set}"
    ports:
      - "127.0.0.1:6379:6379"
    env_file:
      - .env
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - ghstore

  postgres:
    container_name: "GHstore-postgres"
    image: "postgres:16"
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - ghstore

  # Cloudflare Tunnel: exposes the bot (port 5000) to the internet at gh-store.me.
  # In the Cloudflare dashboard, set the public hostname gh-store.me to point at
  # service: http://bot:5000 (docker-internal DNS on the ghstore network).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: GHstore-tunnel
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - bot
    restart: always
    networks:
      - ghstore

# Inbound HTTPS to the bot is provided by this Cloudflare Tunnel (cloudflared),
# mapping gh-store.me -> http://bot:5000. No Caddy/bare ports 80-443 required.

volumes:
  redis_data:
  postgres_data:

networks:
  ghstore:
